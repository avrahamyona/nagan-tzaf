<script>
/* Use the device clock, including while installed as a PWA. */
(function () {
  var h = new Date().getHours();
  var dark = h >= 19 || h < 7;
  document.documentElement.classList.toggle('dark', dark);
  document.getElementById('themeColor').content = dark ? '#111114' : '#ffffff';
})();
</script>

<div id="app">
<main id="main">

  <!-- ============ האזנה ============ -->
  <section id="view-listen" class="view on">
    <h1 class="largetitle">בית</h1>
    <div id="listenBody"></div>
  </section>

  <!-- ============ עיון ============ -->
  <section id="view-browse" class="view">
    <h1 class="largetitle">חדש</h1>
    <div id="browseBody"></div>
  </section>

  <!-- ============ רדיו ============ -->
  <section id="view-radio" class="view">
    <h1 class="largetitle">רדיו</h1>
    <div id="radioBody"></div>
  </section>

  <!-- ============ ספריה ============ -->
  <section id="view-library" class="view">
    <h1 class="largetitle">ספריה</h1>
    <div id="libRows" class="librows"></div>
    <div class="sechead"><h2>רשימות</h2><button id="newPl" class="addpl"><svg><use href="#i-plus"/></svg></button></div>
    <div id="libPls" class="list"></div>
  </section>

  <!-- ============ חיפוש ============ -->
  <section id="view-search" class="view">
    <h1 class="largetitle">חיפוש</h1>
    <div class="searchbox">
      <svg class="sicon"><use href="#i-search"/></svg>
      <input id="searchInput" type="search" inputmode="search" enterkeyhint="search"
        placeholder="אמנים, שירים, מילים ועוד" autocomplete="off">
      <button id="clearSearch" class="xbtn hidden" aria-label="נקה"><svg><use href="#i-x"/></svg></button>
    </div>
    <div id="suggBox" class="suggbox hidden"></div>
    <div id="searchScope" class="searchscope" role="group" aria-label="תחום חיפוש"><button data-scope="library" type="button">הספריה</button><button class="on" data-scope="all" type="button">Avi Music</button></div>
    <div id="searchHome"></div>
    <div id="searchRes" class="hidden">
      <div id="pills" class="pills"></div>
      <div id="resBody"></div>
    </div>
  </section>

  <!-- ============ דף אמן ============ -->
  <section id="page-artist" class="page">
    <div class="ascroll">
      <div class="ahero">
        <div id="aBanner" class="abanner"></div>
        <div class="ahero-fade"></div>
        <button class="pageback" data-close="page-artist"><svg><use href="#i-chev-back"/></svg></button>
        <button id="aDots" class="icircle herodots" aria-label="אפשרויות אמן"><svg><use href="#i-dots"/></svg></button>
        <div class="ahero-meta">
          <h1 id="aName" class="aname"></h1>
          <div class="abtns">
            <button id="aShare" class="icircle" aria-label="שתף אמן"><svg><use href="#i-share"/></svg></button>
            <button id="aPlay" class="icircle big white"><svg><use href="#i-play"/></svg></button>
            <button id="aFav" class="icircle"><svg><use href="#i-star"/></svg></button>
          </div>
        </div>
      </div>
      <div id="aBody"></div>
    </div>
  </section>

  <!-- ============ דף אלבום ============ -->
  <section id="page-album" class="page">
    <div class="ascroll">
      <button class="pageback" data-close="page-album"><svg><use href="#i-chev-back"/></svg></button>
      <div class="albumhead">
        <img id="alArt" class="albumart" alt="">
        <h1 id="alTitle" class="pttl"></h1>
        <button type="button" id="alArtist" class="psub link"></button>
        <div id="alMeta" class="pmeta"></div>
        <div class="playpair">
          <button id="alPlay" class="ppill"><svg><use href="#i-play"/></svg>נגן</button>
          <button id="alShuffle" class="ppill"><svg><use href="#i-shuffle"/></svg>ערבוב</button>
        </div>
      </div>
      <div id="alTracks" class="tracklist"></div>
    </div>
  </section>

  <!-- ============ דף פלייליסט ============ -->
  <section id="page-playlist" class="page">
    <div class="ascroll">
      <button class="pageback" data-close="page-playlist"><svg><use href="#i-chev-back"/></svg></button>
      <div class="albumhead">
        <div id="plArt" class="albumart plart"></div>
        <h1 id="plTitle" class="pttl"></h1>
        <div id="plOwner" class="psub"></div>
        <div id="plMeta" class="pmeta"></div>
        <div class="playpair">
          <button id="plPlay" class="ppill"><svg><use href="#i-play"/></svg>נגן</button>
          <button id="plShuffle" class="ppill"><svg><use href="#i-shuffle"/></svg>ערבוב</button>
        </div>
      </div>
      <div id="plTracks" class="tracklist"></div>
      <div class="plactions">
        <button id="plRename" class="plact">שנה שם</button>
        <button id="plDelete" class="plact danger">מחק רשימה</button>
      </div>
    </div>
  </section>

  <div id="netNote" class="netnote hidden"></div>
</main>

const dialog=document.createElement('dialog');dialog.id='aviBugDialog';dialog.innerHTML='<h2>דיווח על תקלה</h2><textarea maxlength="4000" placeholder="מה לא עובד?" aria-label="תיאור התקלה"></textarea><small>הדיווח כולל גרסה, מצב נגן ושגיאות מסוננות. אין סיסמאות או תוכן ספרייה. צילום מסך יישלח רק אם נלכד בבטחה.</small><img hidden alt="צילום המסך לדיווח"><label><input type="checkbox" checked> לצרף צילום זמין</label><p role="status"></p><button id="aviBugSend" type="button">שלח דיווח</button><button type="button" data-close>ביטול</button>';document.body.append(dialog);dialog.querySelector('[data-close]').onclick=()=>dialog.close();
let snapshot=null,diag=null,payload=null,sending=false;
async function capture(){if(typeof window.html2canvas!=='function')return null;const sensitive='#aviPrivatePlaylists,#aviProfileButton,#page-profile,#aviProfilePage,#view-library,#view-listen,#page-playlist,#mini,#player .pmeta,#player .pmeta2,input,textarea,[data-private]';try{const canvas=await window.html2canvas(document.body,{useCORS:true,allowTaint:false,logging:false,scale:Math.min(1,700/innerWidth),width:innerWidth,height:innerHeight,ignoreElements:e=>e.matches?.('#aviBugButton,#aviBugDialog')||!!e.closest?.(sensitive)});const image=canvas.toDataURL('image/jpeg',0.6);return image.length<320000?image:null;}catch{return null;}}
const POS='aviBugPos';const place=(x,y)=>{const m=6,w=button.offsetWidth||46,hh=button.offsetHeight||46;x=Math.max(m,Math.min(innerWidth-w-m,x));y=Math.max(m,Math.min(innerHeight-hh-m,y));button.style.left=x+'px';button.style.top=y+'px';button.style.right='auto';return[x,y];};
try{const p=JSON.parse(localStorage.getItem(POS)||'null');if(p&&typeof p.x==='number'){place(p.x*innerWidth,p.y*innerHeight);}}catch{}
addEventListener('resize',()=>{try{const p=JSON.parse(localStorage.getItem(POS)||'null');if(p)place(p.x*innerWidth,p.y*innerHeight);}catch{}});
button.style.touchAction='manipulation';button.style.webkitTouchCallout='none';button.style.webkitUserSelect='none';button.style.userSelect='none';
let dragging=false,timer=0,sx=0,sy=0,ox=0,oy=0,moved=false;
const endDrag=()=>{clearTimeout(timer);if(dragging){dragging=false;button.style.transform='';button.style.opacity='';const r=button.getBoundingClientRect();try{localStorage.setItem(POS,JSON.stringify({x:r.left/innerWidth,y:r.top/innerHeight}));}catch{}moved=true;setTimeout(()=>{moved=false;},400);}};
button.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;const r=button.getBoundingClientRect();ox=r.left;oy=r.top;clearTimeout(timer);timer=setTimeout(()=>{dragging=true;button.style.transform='scale(1.2)';button.style.opacity='.85';if(navigator.vibrate)try{navigator.vibrate(30);}catch{}},450);},{passive:true});
button.addEventListener('touchmove',e=>{const t=e.touches[0];if(!dragging){if(Math.hypot(t.clientX-sx,t.clientY-sy)>10)clearTimeout(timer);return;}e.preventDefault();place(ox+t.clientX-sx,oy+t.clientY-sy);},{passive:false});
button.addEventListener('touchend',endDrag);button.addEventListener('touchcancel',endDrag);
button.addEventListener('contextmenu',e=>e.preventDefault());
button.addEventListener('mousedown',e=>{sx=e.clientX;sy=e.clientY;const r=button.getBoundingClientRect();ox=r.left;oy=r.top;clearTimeout(timer);timer=setTimeout(()=>{dragging=true;button.style.transform='scale(1.2)';},450);const mv=ev=>{if(!dragging){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>10)clearTimeout(timer);return;}place(ox+ev.clientX-sx,oy+ev.clientY-sy);};const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up);endDrag();};addEventListener('mousemove',mv);addEventListener('mouseup',up);});
const openDialog=()=>{try{if(typeof dialog.showModal==='function'){if(!dialog.open)dialog.showModal();}else dialog.setAttribute('open','');}catch{dialog.setAttribute('open','');}};
button.onclick=()=>{if(moved||dragging)return;if(sending)return;snapshot=null;diag=diagnostics();diag.capture='pending';payload=null;const img=dialog.querySelector('img');img.hidden=true;img.src='';dialog.querySelector('label').hidden=true;const st=dialog.querySelector('[role=status]');st.textContent='מכין צילום מסך... אפשר כבר לכתוב.';openDialog();const myDiag=diag;Promise.race([capture(),new Promise(r=>setTimeout(()=>r(null),6000))]).then(s=>{if(diag!==myDiag)return;snapshot=s;diag.capture=s?'redacted_dom':'unavailable';img.hidden=!s;if(s)img.src=s;dialog.querySelector('label').hidden=!s;st.textContent=s?'':'צילום בטוח אינו זמין במסך הזה. אפשר לשלוח טקסט ופרטי תקלה.';}).catch(()=>{st.textContent='';});};
dialog.querySelector('#aviBugSend').onclick=async()=>{if(sending)return;const status=dialog.querySelector('[role=status]'),text=dialog.querySelector('textarea').value.trim();if(!text){status.textContent='כתוב מה לא עובד.';return;}if(!window.aviAccount?.profile){status.textContent='צריך להתחבר לחשבון כדי לשלוח.';return;}sending=true;const send=dialog.querySelector('#aviBugSend');send.disabled=true;status.textContent='שומר דיווח...';try{const image=dialog.querySelector('input').checked?snapshot:null;if(!payload||payload.text!==text||payload.screenshot!==image)payload={id:crypto.randomUUID(),text,diagnostics:diag,screenshot:image};const r=await window.aviAccount.api('/g/reports',{method:'POST',body:JSON.stringify(payload)});if(!r.stored||r.id!==payload.id)throw Error('not_stored');status.textContent='נשלח. תודה!';dialog.querySelector('textarea').value='';payload=null;setTimeout(()=>{try{dialog.close();}catch{dialog.removeAttribute('open');}status.textContent='';},1400);}catch{status.textContent='הדיווח לא נשמר. הטקסט נשאר כאן, אפשר לנסות שוב.';}finally{sending=false;send.disabled=false;}};
})();
