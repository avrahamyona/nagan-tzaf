<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Avi Music - בדיקת התחברות</title><style>body{background:#101014;color:white;font-family:Arial;margin:25px;text-align:center}button{padding:12px;border-radius:10px;border:0}pre{white-space:pre-wrap;direction:ltr;font-size:13px}</style></head><body><h1>בדיקת חשבון Avi Music</h1><p>סביבת בדיקה נפרדת. ספריית המוזיקה לא תשתנה.</p><div id="testResult">ממתין להתחברות...</div><button id="testLogout" hidden>יציאה</button><script>
window.AVI_ACCOUNT_CONFIG={clientId:'238419392106-2qjigh5svc1lgjuvepe27lilgjfu79qp.apps.googleusercontent.com',worker:'https://avi-music-account-staging.avi-music.workers.dev'};
document.addEventListener('avi-account-ready',e=>{const p=e.detail.profile;document.getElementById('testResult').textContent='מחובר: '+p.name+' ('+p.email+')';document.getElementById('testLogout').hidden=false;});document.getElementById('testLogout').onclick=()=>window.aviAccount.logout();
</script>
</script><script>
(function(){try{
const cfg=window.AVI_ACCOUNT_CONFIG;if(!cfg?.clientId||!cfg?.worker)return;
const SESSION_KEY='avi_account_session_v1';let token='',profile=null;
try{token=JSON.parse(localStorage.getItem(SESSION_KEY)||'null')?.token||'';}catch{}
const gate=document.createElement('div');gate.id='aviAccountGate';gate.dir='rtl';gate.innerHTML='<div class="avi-account-login"><h1>Avi Music</h1><p id="aviAccountMessage">בודק התחברות...</p><div id="aviGoogleSignIn"></div><button id="aviAccountRetry" hidden>ניסיון נוסף</button><p class="avi-account-note">ההתחברות מגינה על הנתונים האישיים שלך. האתר והגרסאות הישנות נשארים ציבוריים.</p></div>';
const css=document.createElement('style');css.textContent='#aviAccountGate{position:fixed;inset:0;z-index:10000;background:var(--bg,#101014);color:var(--text,#fff);display:grid;place-items:center;padding:24px;box-sizing:border-box}.avi-account-login{max-width:420px;text-align:center}.avi-account-login h1{color:#fa2d55;font-size:36px}#aviGoogleSignIn{display:flex;justify-content:center;margin:24px 0}.avi-account-note{font-size:13px;color:#999;line-height:1.6}#aviAccountRetry{background:#303035;border-radius:12px;padding:12px;color:white}';document.head.append(css);document.body.append(gate);
const message=t=>document.getElementById('aviAccountMessage').textContent=t;
async function api(path,options={}){const headers={'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...options.headers};const ctl=new AbortController(),timeout=setTimeout(()=>ctl.abort(),12000);try{const r=await fetch(cfg.worker+path,{...options,headers,credentials:'omit',signal:ctl.signal});let body;try{body=await r.json();}catch{throw Error('invalid_response');}if(!r.ok){const error=Error(body.error||'account_unavailable');error.status=r.status;throw error;}return body;}finally{clearTimeout(timeout);}}
function showAccount(p){profile=p;gate.hidden=true;gate.style.display='none';document.dispatchEvent(new CustomEvent('avi-account-ready',{detail:{profile:p}}));}
async function signIn(credential,nonce){message('מאמת התחברות...');try{const result=await api('/g/sign-in',{method:'POST',body:JSON.stringify({credential,nonce})});try{localStorage.setItem(SESSION_KEY,JSON.stringify({token:result.token}));}catch{message('לא ניתן לזכור את ההתחברות בדפדפן הזה. נסה מחוץ לגלישה פרטית.');return;}token=result.token;showAccount(result.profile);}catch(e){message(e.message==='no_access'?'אין לחשבון הזה גישה לאזור האישי.':'לא ניתן להתחבר כרגע. הנתונים לא שונו.');document.getElementById('aviAccountRetry').hidden=false;}}
async function loadGoogle(){if(window.google?.accounts?.id)return;await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=ok;s.onerror=()=>no(Error('google_unavailable'));document.head.append(s);});}
async function login(){gate.style.display='grid';gate.hidden=false;document.getElementById('aviAccountRetry').hidden=true;try{const ch=await api('/g/challenge',{method:'POST',body:'{}'});await loadGoogle();message('כניסה עם Google לחשבון שלך');google.accounts.id.initialize({client_id:cfg.clientId,nonce:ch.nonce,auto_select:false,callback:r=>signIn(r.credential,ch.nonce)});document.getElementById('aviGoogleSignIn').replaceChildren();google.accounts.id.renderButton(document.getElementById('aviGoogleSignIn'),{type:'standard',theme:'outline',size:'large',text:'signin_with',locale:'he'});}catch{message('לא ניתן לטעון התחברות כרגע.');document.getElementById('aviAccountRetry').hidden=false;}}
async function restore(){if(!token)return login();try{const data=await api('/g/session');showAccount(data.profile);}catch(e){if(e.status===401||e.status===403){token='';try{localStorage.removeItem(SESSION_KEY);}catch{}return login();}message('לא ניתן לבדוק התחברות כרגע. נסה שוב בלי לשנות נתונים.');document.getElementById('aviAccountRetry').hidden=false;}}
document.getElementById('aviAccountRetry').onclick=restore;
window.aviAccount={api,get profile(){return profile;},async logout(){if(token){try{await api('/g/logout',{method:'POST',body:'{}'});}catch{message('לא ניתן לבטל את ההתחברות כרגע. נסה שוב.');return false;}}token='';profile=null;try{localStorage.removeItem(SESSION_KEY);}catch{}await login();return true;}};
restore();
}catch(e){console.error('account client unavailable',{kind:e?.name});}})();

</script></body></html>
